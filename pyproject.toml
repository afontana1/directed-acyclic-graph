[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "directed-acyclic-graph"
version = "0.1.0"
description = "A directed acyclic graph package with reachability, ordering, connectivity, and pathfinding algorithms."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "AJ Fontes" }
]
license = { text = "MIT" }
keywords = ["dag", "graph", "topological-sort", "pathfinding"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
packages = ["dag"]
